name: Sincronizar Firestore (radar-clima-sul-sul)

on:
  push:
    branches: [main]
    paths:
      - "sync/data-export.json"
      - "scripts/sync-firestore.mjs"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install --no-save firebase-admin

      - name: Sincronizar dados com o Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync-firestore.mjs
